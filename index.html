<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&P Report Creator Pro</title>

<style>
/* =========================================================
   APP UI STYLES (Modern SaaS Design)
========================================================= */
:root {
    --primary: #172033;
    --accent: #D4AF37; /* Lionsgate Gold */
    --accent-hover: #b8952b;
    --bg-gradient: linear-gradient(135deg, #f6f8fd 0%, #e9edf5 100%);
    --card-bg: rgba(255, 255, 255, 0.95);
    --danger: #ef4444;
    --text-main: #1e293b;
    --text-muted: #64748b;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; }

/* Layout */
.app { width: 100%; max-width: 1400px; margin: 0 auto; padding: 40px 30px; }
.header { text-align: center; margin-bottom: 40px; animation: fadeInDown 0.6s ease-out; }
.header h1 { margin: 0 0 10px; font-size: 36px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
.header p { margin: 0; font-size: 16px; color: var(--text-muted); }

.workspace { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 30px; align-items: start; }

/* Panels */
.panel {
    background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.05);
    padding: 32px; border: 1px solid rgba(255,255,255,0.4);
    animation: fadeInUp 0.6s ease-out;
}

/* Make Preview Panel Sticky */
.preview-panel { position: sticky; top: 30px; padding: 0; background: transparent; box-shadow: none; border: none; }
.preview-container { background: #fff; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); overflow: hidden; min-height: 800px; transition: all 0.4s ease; display: flex; flex-direction: column; }
.preview-header { background: #f8fafc; padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
.preview-content { padding: 30px; background: #eef1f5; flex-grow: 1; display: flex; align-items: flex-start; justify-content: center; }

/* Forms */
.section-title { margin: 35px 0 20px; padding-bottom: 10px; border-bottom: 2px solid #f1f5f9; color: var(--primary); font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

input, textarea, select {
    width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px;
    background: #f8fafc; color: var(--text-main); font-size: 14px; transition: all 0.2s ease;
    font-family: inherit;
}
textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15); outline: none; }
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 12px auto; }

/* Buttons */
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
.btn-grid.full { grid-template-columns: 1fr; }
.button {
    width: 100%; padding: 14px 20px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase;
}
.button:active { transform: scale(0.98); }
.button.primary { background: var(--primary); color: #fff; }
.button.primary:hover { background: #293751; box-shadow: 0 4px 12px rgba(23,32,51,0.2); }
.button.gold { background: var(--accent); color: #fff; }
.button.gold:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(212,175,55,0.3); }
.button.secondary { background: #e2e8f0; color: var(--text-main); }
.button.secondary:hover { background: #cbd5e1; }
.button.danger { background: #fee2e2; color: var(--danger); }
.button.danger:hover { background: #fecaca; }

.sig-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 15px; }

/* Toast Notification */
#toast {
    position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
    background: #10b981; color: white; padding: 14px 28px; border-radius: 50px;
    font-weight: 600; font-size: 14px; box-shadow: 0 10px 25px rgba(16,185,129,0.3);
    transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000;
}
#toast.show { bottom: 40px; }

/* Animations */
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 1024px) {
    .workspace { grid-template-columns: 1fr; }
    .preview-panel { position: relative; top: 0; }
}
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>S&P Report Creator Pro</h1>
        <p>Generate beautiful, universally compatible emails instantly.</p>
    </div>

    <div class="workspace">
        <!-- SETTINGS PANEL -->
        <div class="panel settings-panel">
            <div class="section-title" style="margin-top: 0;">🎨 Template Style</div>
            <div class="form-group">
                <label for="templateLayout">Select Layout Structure</label>
                <select id="templateLayout" onchange="updatePreview()">
                    <option value="classic">Layout 1: Classic Professional (Clean & Standard)</option>
                    <option value="dark">Layout 2: Cinematic Dark (Bold & Theatrical)</option>
                    <option value="minimal">Layout 3: Modern Minimalist (Centered & Elegant)</option>
                    <option value="vibrant">Layout 4: Gradient Highlight (Pill Buttons & Shadows)</option>
                </select>
            </div>

            <div class="section-title">📝 Project Information</div>
            <div class="form-group">
                <label for="company">Company / Brand (Header)</label>
                <input type="text" id="company" value="LIONSGATE">
            </div>
            <div class="form-group">
                <label for="reportType">Report Type</label>
                <input type="text" id="reportType" value="S&P Report">
            </div>
            <div class="form-group">
                <label for="projectFull">Project Full Title & ID (e.g. Movie - ID)</label>
                <input type="text" id="projectFull" value="Conan el bárbaro - 9382098CSP">
            </div>
            
            <div class="form-group">
                <label for="driveLink">Project File / Google Drive Link</label>
                <input type="url" id="driveLink" placeholder="Paste Drive link (auto-converts to direct download)">
            </div>
            <div class="form-group">
                <label for="sheetLink">Review Sheet Link</label>
                <input type="url" id="sheetLink" placeholder="Paste Google Sheet link">
            </div>

            <div class="section-title">⚡ Action Required</div>
            <div class="form-group">
                <label for="actionTitle">Action Heading</label>
                <input type="text" id="actionTitle" value="Actions">
            </div>
            <div class="form-group">
                <label for="actionText">Action Description</label>
                <textarea id="actionText">Kindly review the report and update the review sheet with your comments.</textarea>
            </div>

            <div class="section-title">🖋️ Signature Details</div>
            <div class="form-group">
                <label for="savedSignaturesDropdown">Load Saved Signature Profile</label>
                <select id="savedSignaturesDropdown" onchange="loadSelectedSignature()">
                    <option value="">-- Select or Create New --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="signatureName">Name</label>
                <input type="text" id="signatureName" value="John Doe">
            </div>
            <div class="form-group">
                <label for="signatureRole">Designation</label>
                <input type="text" id="signatureRole" value="Creative Consultant">
            </div>
            <div class="sig-row">
                <div class="form-group" style="margin:0;">
                    <label for="signatureMobile">Mobile</label>
                    <input type="tel" id="signatureMobile" placeholder="+1 555-0100">
                </div>
                <div class="form-group" style="margin:0;">
                    <label for="signatureEmail">Email</label>
                    <input type="email" id="signatureEmail" placeholder="name@lionsgate.com">
                </div>
            </div>
            <div class="form-group">
                <label for="signatureWebsite">Website</label>
                <input type="text" id="signatureWebsite" value="www.lionsgate.com">
            </div>

            <div class="sig-row" style="margin-top: 20px; align-items: end;">
                <div class="form-group" style="margin:0;">
                    <label for="sigProfileName">Save Signature As</label>
                    <input type="text" id="sigProfileName" placeholder="e.g. Main Profile">
                </div>
                <button type="button" class="button primary" onclick="saveSignature()">SAVE SIG</button>
            </div>

            <div class="section-title">🚀 Export & Output</div>
            <div class="btn-grid">
                <button type="button" class="button gold" onclick="copyForEmail()">📋 Copy for Email</button>
                <button type="button" class="button secondary" onclick="copyHTMLSource()">💻 Copy HTML Code</button>
            </div>
            <div class="btn-grid">
                <button type="button" class="button secondary" onclick="downloadHTML()">⬇️ Download File</button>
                <button type="button" class="button danger" onclick="clearProjectDetails()">🔄 Restart Form</button>
            </div>
        </div>

        <!-- PREVIEW PANEL -->
        <div class="preview-panel">
            <div class="preview-container">
                <div class="preview-header">
                    <span>Live Output Preview</span>
                    <span style="font-size: 11px; font-weight: normal; background: #e2e8f0; padding: 4px 10px; border-radius: 20px;">Safe for Gmail/Outlook</span>
                </div>
                <div class="preview-content" id="previewWrapperBg">
                    <div id="emailPreviewContainer" style="width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast">Action successful!</div>

<script>
/* =========================================================
   CORE LOGIC & UTILITIES
========================================================= */
const AMAGI_LOGO_URL = "https://ci3.googleusercontent.com/meips/ADKq_Na2RJ-7Y9PdN7oUaa7Cl_FDHZiNrjThXeZFeYSwDPEMwOO4vgEMRCCQEk5mR5dSFuiMwp0baY4ZBYn7pUZ37zT7iYOn1NZhckQTtdbR76PNvDEHXJLMvc6rbbOsvMDMEk0lw33pZJm56N-8-PPTIrn3c5XCrMDy77H9XRFLsMt3sZNivza8ix5KF6qMemQ8PxcSPZXn2nR7ZREkOjGo=s0-d-e1-ft#https://s3.amazonaws.com/cdn.freshdesk.com/data/helpdesk/attachments/production/69003522040/logo/LkC0KD0QCT1-BmqFLXvbNAKC7_SoZZQazw.png";

let signatures = {};

function getSafeStorage() { try { return window.localStorage; } catch (e) { return null; } }
function getValue(id, fallback = "") { const el = document.getElementById(id); return el ? el.value.trim() || fallback : fallback; }
function escapeHTML(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
function safeURL(url) { if (!url) return "#"; if (/^https?:\/\//i.test(url) || url.startsWith("mailto:")) return url; return "https://" + url; }

function getProjectDownloadLink(url) {
    if (!url) return "#";
    const original = String(url).trim();
    const fileMatch = original.match(/\/file\/d\/([a-zA-Z0-9_-]+)/i);
    if (fileMatch && fileMatch[1]) {
        return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(fileMatch[1]);
    }
    return safeURL(original);
}

function parseProjectInput(input) {
    let title = input;
    let id = "";
    if (input.includes("-")) {
        const parts = input.split("-");
        id = parts.pop().trim();
        title = parts.join("-").trim();
    }
    return { title, id };
}

function showToast(message, isError = false) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.style.background = isError ? "#ef4444" : "#10b981";
    toast.classList.add("show");
    setTimeout(() => { toast.classList.remove("show"); }, 3000);
}

/* =========================================================
   SIGNATURE MANAGEMENT
========================================================= */
function initSignatures() {
    const storage = getSafeStorage();
    if (storage) {
        try {
            const saved = storage.getItem("spTemplateSignaturesV2");
            if (saved) signatures = JSON.parse(saved);
        } catch (e) {}
    }
    populateSignatureDropdown();
}

function populateSignatureDropdown() {
    const dropdown = document.getElementById("savedSignaturesDropdown");
    dropdown.innerHTML = '<option value="">-- Select or Create New --</option>';
    for (const key in signatures) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = key;
        dropdown.appendChild(opt);
    }
}

function loadSelectedSignature() {
    const key = document.getElementById("savedSignaturesDropdown").value;
    if (!key || !signatures[key]) return;
    const sig = signatures[key];
    document.getElementById("signatureName").value = sig.name || "";
    document.getElementById("signatureRole").value = sig.role || "";
    document.getElementById("signatureMobile").value = sig.mobile || "";
    document.getElementById("signatureEmail").value = sig.email || "";
    document.getElementById("signatureWebsite").value = sig.website || "";
    updatePreview();
}

function saveSignature() {
    let profileName = getValue("sigProfileName", "").trim();
    if (!profileName) profileName = "Signature " + (Object.keys(signatures).length + 1);
    
    signatures[profileName] = {
        name: getValue("signatureName"),
        role: getValue("signatureRole"),
        mobile: getValue("signatureMobile"),
        email: getValue("signatureEmail"),
        website: getValue("signatureWebsite")
    };

    const storage = getSafeStorage();
    if (storage) {
        try {
            storage.setItem("spTemplateSignaturesV2", JSON.stringify(signatures));
            showToast(`Signature "${profileName}" saved successfully!`);
            populateSignatureDropdown();
            document.getElementById("savedSignaturesDropdown").value = profileName;
        } catch (e) { showToast("Error saving signature locally.", true); }
    }
}

function clearProjectDetails() {
    document.getElementById("projectFull").value = "";
    document.getElementById("driveLink").value = "";
    document.getElementById("sheetLink").value = "";
    document.getElementById("actionText").value = "Kindly review the report and update the review sheet with your comments.";
    updatePreview();
    showToast("Project fields cleared. Ready for new input.");
}

/* =========================================================
   HTML EMAIL GENERATOR (4 DISTINCT LAYOUTS)
========================================================= */
function getEmailHTML() {
    const layoutType = document.getElementById("templateLayout").value;
    
    // Data mapping
    const data = {
        company: escapeHTML(getValue("company", "LIONSGATE")),
        reportType: escapeHTML(getValue("reportType", "S&P Report")),
        fullText: escapeHTML(getValue("projectFull", "Conan el bárbaro - 9382098CSP")),
        driveLink: escapeHTML(getProjectDownloadLink(getValue("driveLink", "#"))),
        sheetLink: escapeHTML(safeURL(getValue("sheetLink", "#"))),
        actionTitle: escapeHTML(getValue("actionTitle", "Actions")),
        actionText: escapeHTML(getValue("actionText", "Kindly review the report.")),
        name: escapeHTML(getValue("signatureName", "Name")),
        role: escapeHTML(getValue("signatureRole", "Consultant")),
        mobile: escapeHTML(getValue("signatureMobile", "")),
        email: escapeHTML(getValue("signatureEmail", "")),
        websiteLabel: escapeHTML(getValue("signatureWebsite", "www.lionsgate.com")),
        websiteUrl: escapeHTML(safeURL(getValue("signatureWebsite", "www.lionsgate.com")))
    };
    
    const parsed = parseProjectInput(getValue("projectFull", "Conan el bárbaro - 9382098CSP"));
    data.movie = escapeHTML(parsed.title);
    data.reportId = escapeHTML(parsed.id);

    // Common Signature HTML block
    const getSignatureHtml = (textColor, mutedColor, linkColor) => `
        <div style="margin-top:35px; padding-top:25px; border-top:1px solid rgba(128,128,128,0.2);">
            <div style="margin-bottom:2px; color:${textColor}; font-size:15px; line-height:22px; font-weight:700;">${data.name}</div>
            <div style="margin-bottom:12px; color:${mutedColor}; font-size:13px; line-height:20px;">${data.role}</div>
            <img src="${AMAGI_LOGO_URL}" alt="Logo" width="85" style="display:block; width:85px; max-width:85px; height:auto; margin-bottom:12px; border:none; outline:none; text-decoration:none; background:transparent;">
            <div style="color:${mutedColor}; font-size:12px; line-height:20px;">
                ${data.mobile ? `<div><strong style="color:${textColor};">M:</strong> ${data.mobile}</div>` : ''}
                ${data.email ? `<div><strong style="color:${textColor};">E:</strong> <a href="mailto:${data.email}" style="color:${linkColor}; text-decoration:none;">${data.email}</a></div>` : ''}
                ${data.websiteLabel ? `<div><strong style="color:${textColor};">W:</strong> <a href="${data.websiteUrl}" target="_blank" style="color:${linkColor}; text-decoration:none;">${data.websiteLabel}</a></div>` : ''}
            </div>
        </div>
    `;

    // ---------------------------------------------------------
    // LAYOUT 1: CLASSIC PROFESSIONAL (Blue & Gold)
    // ---------------------------------------------------------
    if (layoutType === "classic") {
        document.getElementById("previewWrapperBg").style.background = "#eef1f5";
        return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${data.fullText} - ${data.reportType}</title></head>
<body style="margin:0; padding:0; background:#eef1f5; font-family:Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eef1f5; padding:40px 15px;"><tr><td align="center">
<table width="660" cellpadding="0" cellspacing="0" border="0" style="max-width:660px; background:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e2e8f0;">
<tr><td style="background:#172033; padding:35px 40px;">
    <div style="color:#94a3b8; font-size:11px; letter-spacing:2px; text-transform:uppercase;">${data.company}</div>
    <div style="margin-top:6px; color:#ffffff; font-size:24px; font-weight:bold; line-height:32px;">${data.fullText}<br><span style="color:#D4AF37;">${data.reportType}</span></div>
</td></tr>
<tr><td style="height:4px; background:#D4AF37; line-height:0;">&nbsp;</td></tr>
<tr><td style="padding:40px;">
    <div style="color:#475569; font-size:15px; margin-bottom:10px;">Hi Team,</div>
    <div style="color:#0f172a; font-size:24px; font-weight:bold; margin-bottom:20px;">Report Ready for Review</div>
    <div style="color:#475569; font-size:15px; line-height:24px; margin-bottom:30px;">Please find the <strong>${data.fullText} ${data.reportType}</strong> for the title below. Kindly download the project file and review using the provided sheet.</div>
    
    <a href="${data.driveLink}" target="_blank" style="display:block; padding:20px; border:1px solid #cbd5e1; border-radius:8px; background:#f8fafc; text-decoration:none;">
        <table width="100%" cellpadding="0" cellspacing="0"><tr>
            <td width="50" align="left"><div style="font-size:32px; color:#172033;">&#128193;</div></td>
            <td align="left">
                <div style="color:#64748b; font-size:11px; font-weight:bold; letter-spacing:1px; text-transform:uppercase;">Project File</div>
                <div style="color:#0f172a; font-size:18px; font-weight:bold; margin-top:4px;">${data.movie}</div>
                ${data.reportId ? `<div style="color:#64748b; font-size:13px; margin-top:2px;">ID: ${data.reportId}</div>` : ''}
            </td>
            <td width="120" align="right"><span style="background:#172033; color:#fff; padding:10px 16px; border-radius:6px; font-size:12px; font-weight:bold;">&#11015; DOWNLOAD</span></td>
        </tr></table>
    </a>

    <table width="100%" cellpadding="0" cellspacing="0" style="margin-top:30px;"><tr>
        <td width="4" style="background:#D4AF37;">&nbsp;</td>
        <td style="padding-left:16px;">
            <div style="color:#0f172a; font-size:15px; font-weight:bold;">${data.actionTitle}</div>
            <div style="color:#475569; font-size:14px; margin-top:4px; line-height:20px;">${data.actionText}</div>
        </td>
    </tr></table>

    <table cellpadding="0" cellspacing="0" style="margin-top:25px;"><tr><td style="background:#172033; border-radius:6px;">
        <a href="${data.sheetLink}" target="_blank" style="display:inline-block; padding:14px 24px; color:#ffffff; font-size:14px; font-weight:bold; text-decoration:none;">&#9998; OPEN REVIEW SHEET</a>
    </td></tr></table>

    ${getSignatureHtml('#0f172a', '#475569', '#172033')}
</td></tr>
<tr><td style="background:#f1f5f9; padding:20px 40px; color:#94a3b8; font-size:11px; text-align:center;">
    ${data.fullText} &bull; Confidential
</td></tr>
</table>
</td></tr></table></body></html>`;
    }

    // ---------------------------------------------------------
    // LAYOUT 2: CINEMATIC DARK (Black & Gold)
    // ---------------------------------------------------------
    else if (layoutType === "dark") {
        document.getElementById("previewWrapperBg").style.background = "#0f172a";
        return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0; padding:0; background:#0f172a; font-family:Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0f172a; padding:40px 15px;"><tr><td align="center">
<table width="660" cellpadding="0" cellspacing="0" border="0" style="max-width:660px; background:#1e293b; border-radius:0; border:1px solid #334155;">
<tr><td align="center" style="padding:40px 40px 20px;">
    <div style="color:#D4AF37; font-size:14px; letter-spacing:4px; text-transform:uppercase; font-weight:bold;">${data.company}</div>
    <div style="height:1px; background:#334155; width:40px; margin:20px auto;"></div>
    <div style="color:#ffffff; font-size:28px; font-weight:bold; line-height:36px; text-align:center;">${data.movie}</div>
    <div style="color:#94a3b8; font-size:16px; margin-top:8px; text-align:center;">${data.reportType} &bull; ${data.reportId}</div>
</td></tr>
<tr><td style="padding:20px 50px 50px;">

function getPlainText() {
    const projectFull = getValue("projectFull", "Project Name");
    const reportType = getValue("reportType", "S&P Report");
    return `Hi Team,\n\nReport ready for review\n\nPlease find the ${projectFull} ${reportType} for the title below.\n\nDOWNLOAD:\n${getValue("driveLink", "")}\n\n${getValue("actionTitle", "Actions")}\n${getValue("actionText", "")}\n\nREVIEW REPORT:\n${getValue("sheetLink", "")}`;
}

function updatePreview() {
    document.getElementById("emailPreviewContainer").innerHTML = getEmailHTML();
}

async function copyForEmail() {
    updatePreview();
    const html = getEmailHTML();
    const text = getPlainText();

    try {
        if (navigator.clipboard && window.ClipboardItem) {
            const item = new ClipboardItem({
                "text/html": new Blob([html], { type: "text/html" }),
                "text/plain": new Blob([text], { type: "text/plain" })
            });
            await navigator.clipboard.write([item]);
            showToast("Success! Paste directly into Gmail or Outlook.");
            return;
        }
    } catch (e) {}

    // Fallback logic
    const wrapper = document.createElement("div");
    wrapper.innerHTML = html;
    wrapper.style.position = "fixed"; wrapper.style.left = "-999999px";
    document.body.appendChild(wrapper);
    const range = document.createRange();
    range.selectNodeContents(wrapper);
    const selection = window.getSelection();
    selection.removeAllRanges(); selection.addRange(range);
    document.execCommand("copy");
    selection.removeAllRanges(); document.body.removeChild(wrapper);
    showToast("Success! Paste directly into Gmail or Outlook.");
}

async function copyHTMLSource() {
    const html = getEmailHTML();
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(html);
            showToast("HTML source code copied to clipboard.");
            return;
        }
    } catch (e) {}
    const textarea = document.createElement("textarea");
    textarea.value = html;
    document.body.appendChild(textarea);
    textarea.select(); document.execCommand("copy");
    document.body.removeChild(textarea);
    showToast("HTML source code copied to clipboard.");
}

function downloadHTML() {
    const html = getEmailHTML();
    const filename = getValue("projectFull", "Project").replace(/[^a-z0-9]/gi, "_").replace(/_+/g, "_") + "_Report.html";
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("HTML file downloaded to your computer.");
}

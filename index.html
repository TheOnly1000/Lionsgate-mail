<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&P Report Creator Pro v3</title>

<style>
/* =========================================================
   APP UI STYLES
========================================================= */
:root {
    --primary: #0f172a;
    --primary-hover: #1e293b;
    --accent: #D4AF37;
    --accent-hover: #b8952b;
    --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    --card-bg: rgba(255, 255, 255, 0.95);
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #cbd5e1;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; }

.app { width: 100%; max-width: 1500px; margin: 0 auto; padding: 40px 30px; }
.header { text-align: center; margin-bottom: 30px; animation: fadeInDown 0.6s ease-out; }
.header h1 { margin: 0 0 10px; font-size: 38px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
.header p { margin: 0; font-size: 16px; color: var(--text-muted); }

.workspace { display: grid; grid-template-columns: 500px minmax(0, 1fr); gap: 30px; align-items: start; }

/* Panels */
.panel {
    background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); padding: 35px; border: 1px solid rgba(255,255,255,0.6);
}

.preview-panel { position: sticky; top: 30px; padding: 0; background: transparent; box-shadow: none; border: none; }
.preview-container { background: #fff; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid rgba(255,255,255,0.8); display: flex; flex-direction: column; }
.preview-header { background: #f8fafc; padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; }
.preview-content { background: #eef1f5; width: 100%; height: 850px; }

iframe#emailPreviewFrame { width: 100%; height: 100%; border: none; display: block; background: transparent; }

/* Forms & Typography */
.section-title { margin: 35px 0 20px; padding-bottom: 12px; border-bottom: 2px solid #f1f5f9; color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.section-title svg { width: 18px; height: 18px; color: var(--accent); stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;}
.section-title:first-child { margin-top: 0; }

.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

input[type="text"], input[type="url"], input[type="email"], input[type="tel"], textarea, select {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px;
    background: #f8fafc; color: var(--text-main); font-size: 14px; transition: all 0.2s ease; font-family: inherit;
}
textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15); outline: none; }
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%2364748b%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 14px top 50%; background-size: 16px auto; }

/* Checkbox & Color Picker */
.row-flex { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
input[type="color"] { width: 40px; height: 40px; padding: 0; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; }

/* Rich Text Editor */
.rte-container { border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: #fff; }
.rte-toolbar { background: #f1f5f9; padding: 8px; display: flex; gap: 5px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
.rte-btn { background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 5px 8px; cursor: pointer; font-size: 14px; font-weight: bold; color: var(--text-main); transition: 0.2s; }
.rte-btn:hover { background: #e2e8f0; }
.rte-editor { min-height: 100px; padding: 12px; font-size: 14px; outline: none; line-height: 1.5; color: var(--text-main); background: #fff; }
.rte-editor[data-placeholder]:empty:before { content: attr(data-placeholder); color: #94a3b8; pointer-events: none; display: block; }

/* Buttons */
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
.button {
    width: 100%; padding: 12px 18px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase;
}
.button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.button:active { transform: scale(0.98); }
.button.primary { background: var(--primary); color: #fff; }
.button.primary:hover { background: var(--primary-hover); box-shadow: 0 6px 15px rgba(15,23,42,0.2); }
.button.gold { background: var(--accent); color: #fff; }
.button.gold:hover { background: var(--accent-hover); box-shadow: 0 6px 15px rgba(212,175,55,0.3); }
.button.secondary { background: #e2e8f0; color: var(--text-main); }
.button.secondary:hover { background: #cbd5e1; }
.button.danger { background: #fee2e2; color: var(--danger); }
.button.danger:hover { background: #fecaca; color: var(--danger-hover); }

.sig-row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 15px; }
.sig-row-half { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Toast */
#toast {
    position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
    background: #10b981; color: white; padding: 14px 30px; border-radius: 50px; font-weight: 600; font-size: 14px;
    box-shadow: 0 10px 30px rgba(16,185,129,0.4); transition: bottom 0.4s; z-index: 1000; display: flex; align-items: center; gap: 10px;
}
#toast svg { width: 18px; height: 18px; }
#toast.show { bottom: 40px; }

@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 1100px) {
    .workspace { grid-template-columns: 1fr; }
    .preview-panel { position: relative; top: 0; }
    .preview-content { height: 700px; }
}
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>S&P Report Creator Pro</h1>
        <p>Start typing the project name to auto-generate your email.</p>
    </div>

    <div class="workspace">
        <!-- SETTINGS PANEL -->
        <div class="panel settings-panel">
            
            <div class="section-title">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
                Template Layout & Design
            </div>
            <div class="form-group">
                <select id="templateLayout" onchange="updatePreview()">
                    <option value="1">1. Classic Professional (Blue & Gold)</option>
                    <option value="2">2. Cinematic Dark (Black & Gold)</option>
                    <option value="3">3. Modern Minimalist (White & Gray)</option>
                    <option value="4">4. Vibrant Pill-Based (Blue Theme)</option>
                    <option value="5">5. Corporate Emerald (Green Accents)</option>
                    <option value="6">6. Studio Slate (Charcoal & Crimson)</option>
                    <option value="7">7. Elegant Luxury (Cream & Serif)</option>
                    <option value="8">8. Brutalist High Contrast (B&W)</option>
                    <option value="9">9. Tech Neon (Dark Blue & Cyan)</option>
                    <option value="10">10. Soft Pastel (Gentle & Rounded)</option>
                    <option value="11">11. Executive Navy (Navy & Silver)</option>
                    <option value="12">12. Monospace Clean (Typewriter Minimal)</option>
                    <option value="13">13. Warm Terracotta (Earthy Tones)</option>
                    <option value="14">14. Midnight Purple (Deep Royal Purple)</option>
                    <option value="15">15. Forest Minimal (White & Deep Green)</option>
                    <option value="16">16. Ocean Wave (Teal & Slate)</option>
                    <option value="17">17. Desert Sand (Warm Beige & Black)</option>
                    <option value="18">18. High Contrast Yellow (Yellow & Black)</option>
                    <option value="19">19. Glass Edge (Light Gray & Soft Blue)</option>
                    <option value="20">20. Simple Wireframe (Strict Borders)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Custom Accent Color (Optional)</label>
                <div class="row-flex">
                    <input type="checkbox" id="useCustomAccent" onchange="updatePreview()"> 
                    <span style="font-size: 13px; color: var(--text-muted); font-weight:bold;">Override Template Color</span>
                </div>
                <input type="color" id="customAccentColor" value="#D4AF37" oninput="if(document.getElementById('useCustomAccent').checked) updatePreview()">
            </div>

            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                Project Information
            </div>
            <div class="form-group">
                <label>Project Full Title & ID (Start typing here)</label>
                <input type="text" id="projectFull" placeholder="e.g. Conan el bárbaro - 9382098CSP">
            </div>
            <div class="sig-row-half">
                <div class="form-group">
                    <label>Company / Brand</label>
                    <input type="text" id="company" placeholder="LIONSGATE">
                </div>
                <div class="form-group">
                    <label>Report Type</label>
                    <input type="text" id="reportType" placeholder="S&P Report">
                </div>
            </div>
            <div class="form-group">
                <label>Project File / Google Drive Link</label>
                <input type="url" id="driveLink" placeholder="Paste link (auto-converts)">
            </div>
            <div class="form-group">
                <label>Review Sheet Link</label>
                <input type="url" id="sheetLink" placeholder="Paste Google Sheet link">
            </div>

            <div class="section-title">
                <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                Standard Action
            </div>
            <div class="form-group">
                <label>Action Heading</label>
                <input type="text" id="actionTitle" placeholder="Actions">
            </div>
            <div class="form-group">
                <label>Action Description</label>
                <textarea id="actionText" placeholder="Kindly review the report and update the review sheet with your comments."></textarea>
            </div>

            <!-- OPTIONAL RICH TEXT BLOCKS -->
            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Optional Sections (Notes & Warnings)
            </div>
            
            <div class="form-group">
                <label>Optional Note (Standard styling)</label>
                <div class="rte-container">
                    <div class="rte-toolbar">
                        <button class="rte-btn" onclick="execCmd('bold')" title="Bold"><b>B</b></button>
                        <button class="rte-btn" onclick="execCmd('italic')" title="Italic"><i>I</i></button>
                        <button class="rte-btn" onclick="execCmd('underline')" title="Underline"><u>U</u></button>
                        <button class="rte-btn" onclick="execCmd('insertUnorderedList')" title="Bullet List">&bull; List</button>
                        <button class="rte-btn" onclick="execCmd('insertOrderedList')" title="Numbered List">1. List</button>
                        <button class="rte-btn" onclick="insertLink()" title="Insert Link">&#128279;</button>
                        <button class="rte-btn" onclick="insertTable()" title="Insert Table">&#128198;</button>
                    </div>
                    <div class="rte-editor" id="noteEditor" contenteditable="true" data-placeholder="Add an optional note here..." oninput="updatePreview()"></div>
                </div>
            </div>

            <div class="form-group">
                <label style="color: var(--danger);">Critical / Caution (Red styling)</label>
                <div class="rte-container" style="border-color: #fca5a5;">
                    <div class="rte-toolbar" style="background: #fef2f2; border-color: #fca5a5;">
                        <button class="rte-btn" onclick="execCmd('bold')" title="Bold"><b>B</b></button>
                        <button class="rte-btn" onclick="execCmd('italic')" title="Italic"><i>I</i></button>
                        <button class="rte-btn" onclick="execCmd('underline')" title="Underline"><u>U</u></button>
                        <button class="rte-btn" onclick="execCmd('insertUnorderedList')" title="Bullet List">&bull; List</button>
                        <button class="rte-btn" onclick="execCmd('insertOrderedList')" title="Numbered List">1. List</button>
                    </div>
                    <div class="rte-editor" id="cautionEditor" contenteditable="true" data-placeholder="Add a critical warning here..." oninput="updatePreview()"></div>
                </div>
            </div>

            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Signature Details
            </div>
            <div class="form-group">
                <label>Load Saved Signature</label>
                <select id="savedSignaturesDropdown" onchange="loadSelectedSignature()">
                    <option value="">-- Select or Create New --</option>
                </select>
            </div>
            <div class="sig-row-half">
                <div class="form-group"><label>Name</label><input type="text" id="signatureName" placeholder="John Doe"></div>
                <div class="form-group"><label>Designation</label><input type="text" id="signatureRole" placeholder="Creative Consultant"></div>
            </div>
            <div class="sig-row-half">
                <div class="form-group"><label>Mobile</label><input type="tel" id="signatureMobile" placeholder="+1 555-0100"></div>
                <div class="form-group"><label>Email</label><input type="email" id="signatureEmail" placeholder="name@company.com"></div>
            </div>
            <div class="form-group"><label>Website</label><input type="text" id="signatureWebsite" placeholder="www.lionsgate.com"></div>

            <div class="sig-row" style="margin-top: 20px; align-items: end;">
                <div class="form-group" style="margin:0;"><label>Save Profile As</label><input type="text" id="sigProfileName" placeholder="e.g. Main Profile"></div>
                <button type="button" class="button primary" onclick="saveSignature()">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline></svg> Save Sig
                </button>
            </div>

            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Export & Output
            </div>
            <div class="btn-grid">
                <button type="button" class="button gold" onclick="copyForEmail()">
                    <svg viewBox="0 0 24 24"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2"></path></svg> Copy for Email
                </button>
                <button type="button" class="button secondary" onclick="copyHTMLSource()">
                    <svg viewBox="0 0 24 24"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg> Copy HTML
                </button>
            </div>
            <div class="btn-grid">
                <button type="button" class="button secondary" onclick="downloadHTML()">
                    <svg viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Download HTML
                </button>
                <button type="button" class="button danger" onclick="clearAllData()">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"></path></svg> Clear Form
                </button>
            </div>
        </div>

        <!-- PREVIEW PANEL -->
        <div class="preview-panel">
            <div class="preview-container">
                <div class="preview-header">
                    <span>Live HTML Preview</span>
                    <span style="font-size: 11px; font-weight: normal; background: #e2e8f0; padding: 4px 10px; border-radius: 20px; color:#475569;">Auto-fills on typing</span>
                </div>
                <div class="preview-content" id="previewWrapperBg">
                    <iframe id="emailPreviewFrame" title="Email Preview"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    <span id="toastMessage">Action successful!</span>
</div>

<script>
/* =========================================================
   CORE UTILITIES & CONSTANTS
========================================================= */
const AMAGI_LOGO_URL = "https://s3.amazonaws.com/cdn.freshdesk.com/data/helpdesk/attachments/production/69003522040/logo/LkC0KD0QCT1-BmqFLXvbNAKC7_SoZZQazw.png";
const SIG_STORAGE_KEY = "SP_Template_Signatures_Persistent_V1"; // Hard key
let signatures = {};

function getSafeStorage() { try { return window.localStorage; } catch (e) { return null; } }
function getValue(id, fallback = "") { const el = document.getElementById(id); return (el && el.value.trim() !== "") ? el.value.trim() : fallback; }
function escapeHTML(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
function safeURL(url) { if (!url || url==="#") return "#"; if (/^https?:\/\//i.test(url) || url.startsWith("mailto:")) return url; return "https://" + url; }

function getProjectDownloadLink(url) {
    if (!url || url==="#") return "#";
    const original = String(url).trim();
    const fileMatch = original.match(/\/file\/d\/([a-zA-Z0-9_-]+)/i);
    if (fileMatch && fileMatch[1]) {
        return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(fileMatch[1]);
    }
    return safeURL(original);
}

function parseProjectInput(input) {
    let title = input; let id = "";
    if (input.includes("-")) {
        const parts = input.split("-");
        id = parts.pop().trim();
        title = parts.join("-").trim();
    }
    return { title, id };
}

function showToast(message, isError = false) {
    const toast = document.getElementById("toast");
    document.getElementById("toastMessage").textContent = message;
    toast.style.background = isError ? "#ef4444" : "#10b981";
    toast.classList.add("show");
    setTimeout(() => { toast.classList.remove("show"); }, 3000);
}

/* =========================================================
   RICH TEXT EDITOR LOGIC
========================================================= */
function execCmd(command) {
    document.execCommand(command, false, null);
    updatePreview();
}
function insertLink() {
    const url = prompt("Enter the link URL:");
    if (url) { document.execCommand("createLink", false, url); updatePreview(); }
}
function insertTable() {
    const rows = prompt("Number of rows?", "2");
    const cols = prompt("Number of columns?", "2");
    if (rows && cols && !isNaN(rows) && !isNaN(cols)) {
        let tableHTML = '<table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse; width:100%; border-color:#cbd5e1; margin-top:10px;">';
        for(let i=0; i<rows; i++){
            tableHTML += '<tr>';
            for(let j=0; j<cols; j++){ tableHTML += '<td>Data</td>'; }
            tableHTML += '</tr>';
        }
        tableHTML += '</table><br>';
        document.execCommand('insertHTML', false, tableHTML);
        updatePreview();
    }
}
function getRTEContent(id) {
    const el = document.getElementById(id);
    return el.innerHTML.trim();
}

/* =========================================================
   SIGNATURE MANAGEMENT
========================================================= */
function initSignatures() {
    const storage = getSafeStorage();
    if (storage) {
        try {
            const saved = storage.getItem(SIG_STORAGE_KEY);
            if (saved) signatures = JSON.parse(saved);
        } catch (e) {}
    }
    populateSignatureDropdown();
}

function populateSignatureDropdown() {
    const dropdown = document.getElementById("savedSignaturesDropdown");
    dropdown.innerHTML = '<option value="">-- Select or Create New --</option>';
    for (const key in signatures) {
        const opt = document.createElement("option");
        opt.value = key; opt.textContent = key; dropdown.appendChild(opt);
    }
}

function loadSelectedSignature() {
    const key = document.getElementById("savedSignaturesDropdown").value;
    if (!key || !signatures[key]) return;
    const sig = signatures[key];
    document.getElementById("signatureName").value = sig.name || "";
    document.getElementById("signatureRole").value = sig.role || "";
    document.getElementById("signatureMobile").value = sig.mobile || "";
    document.getElementById("signatureEmail").value = sig.email || "";
    document.getElementById("signatureWebsite").value = sig.website || "";
    updatePreview();
}

function saveSignature() {
    let profileName = document.getElementById("sigProfileName").value.trim();
    if (!profileName) profileName = "Signature " + (Object.keys(signatures).length + 1);
    
    signatures[profileName] = {
        name: document.getElementById("signatureName").value,
        role: document.getElementById("signatureRole").value,
        mobile: document.getElementById("signatureMobile").value,
        email: document.getElementById("signatureEmail").value,
        website: document.getElementById("signatureWebsite").value
    };

    const storage = getSafeStorage();
    if (storage) {
        try {
            storage.setItem(SIG_STORAGE_KEY, JSON.stringify(signatures));
            showToast(`Signature "${profileName}" saved permanently!`);
            populateSignatureDropdown();
            document.getElementById("savedSignaturesDropdown").value = profileName;
        } catch (e) { showToast("Error saving signature.", true); }
    }
}

/* =========================================================
   RESTART / WIPE ALL DATA
========================================================= */
function clearAllData() {
    if(!confirm("Wipe all inputs clean? (Signatures will remain saved)")) return;
    document.querySelectorAll('input[type="text"], input[type="url"], input[type="email"], input[type="tel"], textarea').forEach(el => el.value = '');
    document.getElementById("noteEditor").innerHTML = '';
    document.getElementById("cautionEditor").innerHTML = '';
    document.getElementById("templateLayout").value = "1";
    document.getElementById("useCustomAccent").checked = false;
    updatePreview();
    showToast("Form cleared.");
}

/* =========================================================
   HTML EMAIL GENERATOR (20 LAYOUTS)
========================================================= */
function getEmailHTML() {
    const fullInput = document.getElementById("projectFull").value.trim();
    if(!fullInput) {
        // Show empty placeholder state if completely blank

            </td></tr></table></td></tr></table>`;
            break;
    }

    document.getElementById("previewWrapperBg").style.background = previewBg;
    return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${data.movie}</title></head><body style="margin:0;padding:0;">${html}</body></html>`;
}

function getPlainText() {
    return `Hi Team,\n\nReport ready for review\n\nPlease find the ${getValue("projectFull")} ${getValue("reportType")} for the title below.\n\nDOWNLOAD:\n${getValue("driveLink")}\n\n${getValue("actionTitle")}\n${getValue("actionText")}\n\nREVIEW REPORT:\n${getValue("sheetLink")}`;
}

// Writes perfectly safely to the iframe sandbox
function updatePreview() {
    const html = getEmailHTML();
    const iframe = document.getElementById("emailPreviewFrame");
    iframe.srcdoc = html;
}

async function copyForEmail() {
    const fullInput = document.getElementById("projectFull").value.trim();
    if(!fullInput) { showToast("Please enter a Project Title first.", true); return; }
    
    updatePreview();
    const html = getEmailHTML();
    const text = getPlainText();

    try {
        if (navigator.clipboard && window.ClipboardItem) {
            const item = new ClipboardItem({
                "text/html": new Blob([html], { type: "text/html" }),
                "text/plain": new Blob([text], { type: "text/plain" })
            });
            await navigator.clipboard.write([item]);
            showToast("Copied! Paste directly into Gmail or Outlook.");
            return;
        }
    } catch (e) {}

    const wrapper = document.createElement("div");
    wrapper.innerHTML = html;
    wrapper.style.position = "fixed"; wrapper.style.left = "-999999px";
    document.body.appendChild(wrapper);
    const range = document.createRange();
    range.selectNodeContents(wrapper);
    const selection = window.getSelection();
    selection.removeAllRanges(); selection.addRange(range);
    document.execCommand("copy");
    selection.removeAllRanges(); document.body.removeChild(wrapper);
    showToast("Copied! Paste directly into Gmail or Outlook.");
}

async function copyHTMLSource() {
    const fullInput = document.getElementById("projectFull").value.trim();
    if(!fullInput) { showToast("Please enter a Project Title first.", true); return; }

    const html = getEmailHTML();
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(html);
            showToast("HTML source code copied.");
            return;
        }
    } catch (e) {}
    const textarea = document.createElement("textarea");
    textarea.value = html;
    document.body.appendChild(textarea);
    textarea.select(); document.execCommand("copy");
    document.body.removeChild(textarea);
    showToast("HTML source code copied.");
}

function downloadHTML() {
    const fullInput = document.getElementById("projectFull").value.trim();
    if(!fullInput) { showToast("Please enter a Project Title first.", true); return; }

    const html = getEmailHTML();
    const filename = fullInput.replace(/[^a-z0-9]/gi, "_").replace(/_+/g, "_") + "_Report.html";
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("HTML file downloaded.");
}

// Attach event listeners to auto-update
['templateLayout', 'useCustomAccent', 'company', 'reportType', 'projectFull', 'driveLink', 'sheetLink', 'actionTitle', 'actionText', 'signatureName', 'signatureRole', 'signatureMobile', 'signatureEmail', 'signatureWebsite'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', updatePreview);
});

(function initialize() {
    initSignatures();
    // Default form to blank initially (except standard labels)
    document.getElementById("projectFull").value = "";
    document.getElementById("driveLink").value = "";
    document.getElementById("sheetLink").value = "";
    document.getElementById("noteEditor").innerHTML = "";
    document.getElementById("cautionEditor").innerHTML = "";
    updatePreview();
})();
</script>

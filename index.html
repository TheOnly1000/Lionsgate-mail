<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S&P Report Email Template Maker</title>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #eef1f5; color: #172033; font-family: Arial, Helvetica, sans-serif; }

.app { width: 100%; max-width: 1320px; margin: 0 auto; padding: 32px 22px 60px; }
.page-header { margin-bottom: 25px; }
.page-header h1 { margin: 0 0 7px; font-size: 28px; line-height: 36px; font-weight: 700; }
.page-header p { margin: 0; font-size: 14px; line-height: 22px; color: #6d788a; }

.workspace { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 25px; align-items: start; }
.panel { background: #fff; border-radius: 14px; box-shadow: 0 8px 30px rgba(23, 32, 51, .07); }
.settings-panel, .preview-panel { padding: 25px; }
.panel-title { margin: 0 0 20px; font-size: 15px; line-height: 20px; font-weight: 700; }

.section-title {
    margin: 26px 0 15px; padding-bottom: 9px; border-bottom: 1px solid #edf0f4;
    color: #929baa; font-size: 10px; line-height: 14px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;
}

.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 7px; color: #536074; font-size: 10px; line-height: 14px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }

input[type="text"], input[type="url"], input[type="email"], input[type="tel"], textarea, select {
    width: 100%; margin: 0; padding: 11px 12px; border: 1px solid #d9dee7; border-radius: 7px;
    background: #fff; color: #172033; font-family: Arial, Helvetica, sans-serif; font-size: 13px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
}
input[type="text"], input[type="url"], input[type="email"], input[type="tel"], select { height: 43px; }
textarea { min-height: 82px; resize: vertical; line-height: 19px; }
input::placeholder, textarea::placeholder { color: #a5adba; }
input:focus, textarea:focus, select:focus { border-color: #172033; box-shadow: 0 0 0 3px rgba(23, 32, 51, .06); }

.button {
    width: 100%; min-height: 43px; margin-top: 8px; padding: 0 15px; border: 0; border-radius: 7px;
    background: #172033; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 11px;
    line-height: 16px; font-weight: 700; letter-spacing: .5px; cursor: pointer; transition: background .15s ease, transform .15s ease;
}
.button:hover { background: #293751; }
.button:active { transform: translateY(1px); }
.button.gold { background: #e5b94d; color: #172033; }
.button.gold:hover { background: #d9ad3e; }
.button.secondary { background: #e9edf3; color: #172033; }
.button.secondary:hover { background: #dce2ea; }
.button.danger { background: #fee2e2; color: #991b1b; }
.button.danger:hover { background: #fecaca; }

.saved-message { display: none; margin-top: 10px; padding: 10px 12px; border: 1px solid #cce5d2; border-radius: 7px; background: #edf7f0; color: #3b6d48; font-size: 11px; line-height: 16px; }

.preview-label { margin-bottom: 12px; color: #929baa; font-size: 10px; line-height: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.preview-wrapper { min-height: 720px; padding: 30px; border-radius: 10px; transition: background 0.3s ease; }
.email-card { width: 100%; max-width: 660px; margin: 0 auto; overflow: hidden; border-radius: 14px; transition: background 0.3s ease, box-shadow 0.3s ease; }

.sig-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }

@media (max-width: 950px) { .workspace { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .app { padding: 20px 10px 40px; } .settings-panel, .preview-panel { padding: 18px; } .preview-wrapper { padding: 10px; } }
</style>
</head>
<body>

<div class="app">
    <div class="page-header">
        <h1>S&amp;P Report Template Maker</h1>
        <p>Create a professional report email for any movie, title or project with custom themes.</p>
    </div>

    <div class="workspace">
        <!-- SETTINGS PANEL -->
        <div class="panel settings-panel">
            <div class="panel-title">Template Details</div>
            
            <div class="form-group">
                <label for="templateTheme">Theme / Style Variation</label>
                <select id="templateTheme" onchange="updatePreview()">
                    <option value="0">Default (Dark Blue & Gold)</option>
                    <option value="1">Lionsgate Crimson & Gold</option>
                    <option value="2">Modern Midnight & Blue</option>
                    <option value="3">Clean White & Emerald</option>
                    <option value="4">Silver & Crimson</option>
                    <option value="5">Deep Purple & Orange</option>
                    <option value="6">Teal & Coral</option>
                    <option value="7">Slate & Yellow</option>
                    <option value="8">High Contrast B&W</option>
                    <option value="9">Corporate Gray & Blue</option>
                </select>
            </div>

            <div class="section-title">Report Information</div>

            <div class="form-group">
                <label for="company">Company / Brand</label>
                <input type="text" id="company" value="LIONSGATE">
            </div>
            <div class="form-group">
                <label for="reportType">Report Type</label>
                <input type="text" id="reportType" value="S&P Report">
            </div>
            <div class="form-group">
                <label for="projectFull">Project Full Title & ID</label>
                <input type="text" id="projectFull" value="Conan el bárbaro - 9382098CSP">
            </div>
            <div class="form-group">
                <label for="driveLink">Project File / Drive Link</label>
                <input type="url" id="driveLink" placeholder="Paste Drive / Project File link">
            </div>
            <div class="form-group">
                <label for="sheetLink">Review Sheet Link</label>
                <input type="url" id="sheetLink" placeholder="Paste Google Sheet link">
            </div>

            <div class="section-title">Action Section</div>
            <div class="form-group">
                <label for="actionTitle">Action Heading</label>
                <input type="text" id="actionTitle" value="Actions">
            </div>
            <div class="form-group">
                <label for="actionText">Action Description</label>
                <textarea id="actionText">Kindly review the report.</textarea>
            </div>

            <div class="section-title">Signature Management</div>
            <div class="form-group">
                <label for="savedSignaturesDropdown">Load Saved Signature</label>
                <select id="savedSignaturesDropdown" onchange="loadSelectedSignature()">
                    <option value="">-- Select a Signature --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="signatureName">Name</label>
                <input type="text" id="signatureName" value="Name">
            </div>
            <div class="form-group">
                <label for="signatureRole">Designation</label>
                <input type="text" id="signatureRole" value="Consultant, Creative">
            </div>
            <div class="form-group">
                <label for="signatureMobile">Mobile</label>
                <input type="tel" id="signatureMobile" placeholder="+91 XXXXX XXXXX">
            </div>
            <div class="form-group">
                <label for="signatureEmail">Email</label>
                <input type="email" id="signatureEmail" placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label for="signatureWebsite">Website</label>
                <input type="text" id="signatureWebsite" value="www.lionsgate.com">
            </div>

            <div class="sig-row">
                <input type="text" id="sigProfileName" placeholder="Save As (e.g. Main)">
                <button type="button" class="button gold" style="margin-top:0;" onclick="saveSignature()">SAVE SIG</button>
            </div>
            <div id="savedMessage" class="saved-message"></div>

            <div class="section-title">Generate</div>
            <button type="button" class="button" onclick="updatePreview()">REFRESH PREVIEW</button>
            <button type="button" class="button gold" onclick="copyForEmail()">COPY FOR EMAIL</button>
            <button type="button" class="button secondary" onclick="copyHTMLSource()">COPY HTML SOURCE</button>
            <button type="button" class="button secondary" onclick="downloadHTML()">DOWNLOAD HTML</button>
            <button type="button" class="button danger" onclick="clearProjectDetails()">RESTART (CLEAR DATA)</button>
        </div>

        <!-- PREVIEW PANEL -->
        <div class="panel preview-panel">
            <div class="preview-label">Live HTML Preview (Uses safe email layouts)</div>
            <div class="preview-wrapper" id="previewWrapperBg">
                <div id="emailPreviewContainer"></div>
            </div>
        </div>
    </div>
</div>

<script>
const AMAGI_LOGO_URL = "https://ci3.googleusercontent.com/meips/ADKq_Na2RJ-7Y9PdN7oUaa7Cl_FDHZiNrjThXeZFeYSwDPEMwOO4vgEMRCCQEk5mR5dSFuiMwp0baY4ZBYn7pUZ37zT7iYOn1NZhckQTtdbR76PNvDEHXJLMvc6rbbOsvMDMEk0lw33pZJm56N-8-PPTIrn3c5XCrMDy77H9XRFLsMt3sZNivza8ix5KF6qMemQ8PxcSPZXn2nR7ZREkOjGo=s0-d-e1-ft#https://s3.amazonaws.com/cdn.freshdesk.com/data/helpdesk/attachments/production/69003522040/logo/LkC0KD0QCT1-BmqFLXvbNAKC7_SoZZQazw.png";

// 10 Theme Variations
const themes = [
    { name: "Default (Dark Blue & Gold)", bg: "#eef1f5", cardBg: "#ffffff", headerBg: "#172033", accent: "#e5b94d", text: "#172033", textMuted: "#697588", link: "#1747c7" },
    { name: "Lionsgate Crimson & Gold", bg: "#f5f5f5", cardBg: "#ffffff", headerBg: "#7B0000", accent: "#D4AF37", text: "#222222", textMuted: "#555555", link: "#7B0000" },
    { name: "Modern Midnight & Blue", bg: "#e2e8f0", cardBg: "#ffffff", headerBg: "#0f172a", accent: "#3b82f6", text: "#1e293b", textMuted: "#64748b", link: "#2563eb" },
    { name: "Clean White & Emerald", bg: "#f0fdf4", cardBg: "#ffffff", headerBg: "#065f46", accent: "#10b981", text: "#1f2937", textMuted: "#4b5563", link: "#059669" },
    { name: "Silver & Crimson", bg: "#f3f4f6", cardBg: "#ffffff", headerBg: "#4b5563", accent: "#dc2626", text: "#111827", textMuted: "#6b7280", link: "#b91c1c" },
    { name: "Deep Purple & Orange", bg: "#faf5ff", cardBg: "#ffffff", headerBg: "#4c1d95", accent: "#f97316", text: "#2e1065", textMuted: "#6b21a8", link: "#7c3aed" },
    { name: "Teal & Coral", bg: "#f0fdfa", cardBg: "#ffffff", headerBg: "#115e59", accent: "#f43f5e", text: "#134e4a", textMuted: "#0f766e", link: "#0d9488" },
    { name: "Slate & Yellow", bg: "#f8fafc", cardBg: "#ffffff", headerBg: "#334155", accent: "#eab308", text: "#0f172a", textMuted: "#475569", link: "#ca8a04" },
    { name: "High Contrast B&W", bg: "#e5e5e5", cardBg: "#ffffff", headerBg: "#000000", accent: "#cccccc", text: "#000000", textMuted: "#666666", link: "#000000" },
    { name: "Corporate Gray & Blue", bg: "#e9ecef", cardBg: "#ffffff", headerBg: "#343a40", accent: "#4dabf7", text: "#212529", textMuted: "#6c757d", link: "#228be6" }
];

let signatures = {};

function getSafeStorage() {
    try { return window.localStorage; } catch (e) { return null; }
}

function getValue(id, fallback = "") {
    const el = document.getElementById(id);
    return el ? el.value.trim() || fallback : fallback;
}
function escapeHTML(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function safeURL(url) {
    if (!url) return "#";
    if (/^https?:\/\//i.test(url) || url.startsWith("mailto:")) return url;
    return "https://" + url;
}

function getProjectDownloadLink(url) {
    if (!url) return "#";
    const original = String(url).trim();
    const fileMatch = original.match(/\/file\/d\/([a-zA-Z0-9_-]+)/i);
    if (fileMatch && fileMatch[1]) {
        return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(fileMatch[1]);
    }
    return safeURL(original);
}

function parseProjectInput(input) {
    let title = input;
    let id = "";
    if (input.includes("-")) {
        const parts = input.split("-");
        id = parts.pop().trim();
        title = parts.join("-").trim();
    }
    return { title, id };
}

function showMessage(message) {
    const el = document.getElementById("savedMessage");
    if (!el) return;
    el.textContent = message;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3000);
}

/* =========================================================
   SIGNATURE MANAGEMENT
========================================================= */
function initSignatures() {
    const storage = getSafeStorage();
    if (storage) {
        try {
            const saved = storage.getItem("spTemplateSignatures");
            if (saved) signatures = JSON.parse(saved);
        } catch (e) {}
    }
    populateSignatureDropdown();
}

function populateSignatureDropdown() {
    const dropdown = document.getElementById("savedSignaturesDropdown");
    dropdown.innerHTML = '<option value="">-- Select a Signature --</option>';
    for (const key in signatures) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = key;
        dropdown.appendChild(opt);
    }
}

function loadSelectedSignature() {
    const key = document.getElementById("savedSignaturesDropdown").value;
    if (!key || !signatures[key]) return;
    const sig = signatures[key];
    document.getElementById("signatureName").value = sig.name || "";
    document.getElementById("signatureRole").value = sig.role || "";
    document.getElementById("signatureMobile").value = sig.mobile || "";
    document.getElementById("signatureEmail").value = sig.email || "";
    document.getElementById("signatureWebsite").value = sig.website || "";
    updatePreview();
}

function saveSignature() {
    let profileName = getValue("sigProfileName", "").trim();
    if (!profileName) profileName = "Signature " + (Object.keys(signatures).length + 1);
    
    signatures[profileName] = {
        name: getValue("signatureName"),
        role: getValue("signatureRole"),
        mobile: getValue("signatureMobile"),
        email: getValue("signatureEmail"),
        website: getValue("signatureWebsite")
    };

    const storage = getSafeStorage();
    if (storage) {
        try {
            storage.setItem("spTemplateSignatures", JSON.stringify(signatures));
            showMessage(`Signature "${profileName}" saved!`);
            populateSignatureDropdown();
            document.getElementById("savedSignaturesDropdown").value = profileName;
        } catch (e) { showMessage("Error saving locally."); }
    }
}

/* =========================================================
   BUILD EMAIL HTML (GMAIL SAFE - NO SVGS)
========================================================= */

    const projectFull = getValue("projectFull", "Conan el bárbaro - 9382098CSP");
    const { title: movie, id: reportId } = parseProjectInput(projectFull);
    
    const driveLink = getProjectDownloadLink(getValue("driveLink", "#"));
    const sheetLink = safeURL(getValue("sheetLink", "#"));
    const actionTitle = getValue("actionTitle", "Actions");
    const actionText = getValue("actionText", "Kindly review the report.");
    
    const name = getValue("signatureName", "Name");
    const role = getValue("signatureRole", "Consultant");
    const mobile = getValue("signatureMobile", "");
    const email = getValue("signatureEmail", "");
    const website = safeURL(getValue("signatureWebsite", "www.lionsgate.com"));
    const websiteRaw = getValue("signatureWebsite", "www.lionsgate.com");

    return `<!DOCTYPE html>

<body style="margin:0; padding:0; background:${t.bg}; font-family:Arial,Helvetica,sans-serif; color:${t.text};">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background:${t.bg}; padding:45px 15px;">
<tr>
<td align="center">

<table width="660" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:660px; background:${t.cardBg}; border-radius:14px; overflow:hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">

<!-- HEADER -->
<tr>
<td style="background:${t.headerBg}; padding:30px 38px;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td>
<div style="color:rgba(255,255,255,0.7); font-size:11px; line-height:16px; letter-spacing:2px; text-transform:uppercase;">
${escapeHTML(company)}
</div>
<div style="margin-top:4px; color:#ffffff; font-size:20px; line-height:28px; font-weight:700;">
${escapeHTML(projectFull)}<br>${escapeHTML(reportType)}
</div>
</td>
<td width="54" align="right">
<div style="width:46px; height:46px; background:rgba(255,255,255,0.1); border-radius:10px; line-height:46px; text-align:center; color:${t.accent}; font-size:24px;">
&#128193;
</div>
</td>
</tr>
</table>
</td>
</tr>

<!-- ACCENT LINE -->
<tr>
<td style="height:4px; background:${t.accent}; font-size:0; line-height:0;">&nbsp;</td>
</tr>

<!-- CONTENT -->
<tr>
<td style="padding:40px 42px;">

<div style="margin-bottom:9px; color:${t.textMuted}; font-size:14px; line-height:21px;">Hi Team,</div>
<div style="margin-bottom:13px; color:${t.text}; font-size:26px; line-height:34px; font-weight:700;">Report ready for review</div>
<div style="margin-bottom:30px; color:${t.textMuted}; font-size:14px; line-height:23px;">
Please find the <strong style="color:${t.text};">${escapeHTML(projectFull)} ${escapeHTML(reportType)}</strong> for the title below. Kindly download the project file and review the details using the review sheet.
</div>

<!-- DOWNLOAD CARD -->
<a href="${escapeHTML(driveLink)}" target="_blank" rel="noopener" style="display:block; padding:22px; border:1px solid #e3e7ed; border-radius:12px; background:${t.bg}; color:inherit; text-decoration:none;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td width="54" valign="middle">
<div style="width:44px; height:44px; background:#fff; border:1px solid #d9dee7; border-radius:9px; line-height:44px; text-align:center; font-size:22px; color:${t.text};">&#128196;</div>
</td>

<div style="margin-top:3px; color:${t.text}; font-size:17px; line-height:24px; font-weight:700;">${escapeHTML(movie)}</div>
${reportId ? `<div style="margin-top:3px; color:${t.textMuted}; font-size:12px; line-height:18px;">Report ID &nbsp;•&nbsp; ${escapeHTML(reportId)}</div>` : ''}
</td>

</td>

</table>

<!-- REVIEW BUTTON -->
<table cellpadding="0" cellspacing="0" border="0" style="margin-top:25px;">

<!-- SIGNATURE -->
<div style="margin-top:32px; padding-top:25px; border-top:1px solid #edf0f3;">

</table>

function getPlainText() {
    const projectFull = getValue("projectFull", "Conan el bárbaro - 9382098CSP");
    const reportType = getValue("reportType", "S&P Report");
    const driveLink = getValue("driveLink", "");
    const sheetLink = getValue("sheetLink", "");
    const actionTitle = getValue("actionTitle", "Actions");
    const actionText = getValue("actionText", "Kindly review the report.");
    
    return `Hi Team,\n\nReport ready for review\n\nPlease find the ${projectFull} ${reportType} for the title below.\n\nDOWNLOAD:\n${driveLink}\n\n${actionTitle}\n${actionText}\n\nREVIEW REPORT:\n${sheetLink}`;
}

function updatePreview() {
    const t = themes[parseInt(document.getElementById("templateTheme").value) || 0];
    document.getElementById("previewWrapperBg").style.background = t.bg;
    document.getElementById("emailPreviewContainer").innerHTML = getEmailHTML();
}

function clearProjectDetails() {
    if(!confirm("Clear all project inputs? Signatures will be kept.")) return;
    document.getElementById("projectFull").value = "";
    document.getElementById("driveLink").value = "";
    document.getElementById("sheetLink").value = "";
    updatePreview();
}

async function copyForEmail() {
    updatePreview();
    const html = getEmailHTML();
    const text = getPlainText();

    try {
        if (navigator.clipboard && window.ClipboardItem) {
            const item = new ClipboardItem({
                "text/html": new Blob([html], { type: "text/html" }),
                "text/plain": new Blob([text], { type: "text/plain" })
            });
            await navigator.clipboard.write([item]);
            showMessage("Email copied. Paste directly into Gmail/Outlook.");
            return;
        }
    } catch (e) {}

    // Fallback
    const wrapper = document.createElement("div");
    wrapper.innerHTML = html;
    wrapper.style.position = "fixed"; wrapper.style.left = "-999999px";
    document.body.appendChild(wrapper);
    const range = document.createRange();
    range.selectNodeContents(wrapper);
    const selection = window.getSelection();
    selection.removeAllRanges(); selection.addRange(range);
    document.execCommand("copy");
    selection.removeAllRanges(); document.body.removeChild(wrapper);
    showMessage("Email copied. Paste directly into Gmail/Outlook.");
}

async function copyHTMLSource() {
    const html = getEmailHTML();
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(html);
            showMessage("HTML source code copied.");
            return;
        }
    } catch (e) {}
    const textarea = document.createElement("textarea");
    textarea.value = html;
    document.body.appendChild(textarea);
    textarea.select(); document.execCommand("copy");
    document.body.removeChild(textarea);
    showMessage("HTML source code copied.");
}

function downloadHTML() {
    const html = getEmailHTML();
    let filename = getValue("projectFull", "Project").replace(/[^a-z0-9]/gi, "_").replace(/_+/g, "_") + "_Email.html";
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showMessage("HTML file downloaded.");
}

// Event Listeners for live preview update
['templateTheme', 'company', 'reportType', 'projectFull', 'driveLink', 'sheetLink', 'actionTitle', 'actionText', 'signatureName', 'signatureRole', 'signatureMobile', 'signatureEmail', 'signatureWebsite'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', updatePreview);
});

(function initialize() {
    initSignatures();
    updatePreview();
})();

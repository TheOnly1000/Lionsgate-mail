<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&P Report Creator Pro</title>

<style>
/* =========================================================
   APP UI STYLES (Premium SaaS Design)
========================================================= */
:root {
    --primary: #0f172a;
    --primary-hover: #1e293b;
    --accent: #D4AF37;
    --accent-hover: #b8952b;
    --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    --card-bg: rgba(255, 255, 255, 0.95);
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #cbd5e1;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; }

.app { width: 100%; max-width: 1440px; margin: 0 auto; padding: 40px 30px; }
.header { text-align: center; margin-bottom: 40px; animation: fadeInDown 0.6s ease-out; }
.header h1 { margin: 0 0 10px; font-size: 38px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
.header p { margin: 0; font-size: 16px; color: var(--text-muted); }

.workspace { display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 30px; align-items: start; }

/* Panels */
.panel {
    background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
    padding: 35px; border: 1px solid rgba(255,255,255,0.6);
    animation: fadeInUp 0.6s ease-out;
}

.preview-panel { position: sticky; top: 30px; padding: 0; background: transparent; box-shadow: none; border: none; }
.preview-container { background: #fff; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid rgba(255,255,255,0.8); display: flex; flex-direction: column; }
.preview-header { background: #f8fafc; padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; }
.preview-content { background: #eef1f5; width: 100%; height: 850px; }

/* IFRAME STYLING - Isolated perfectly */
iframe#emailPreviewFrame { width: 100%; height: 100%; border: none; display: block; background: transparent; }

/* Forms */
.section-title { 
    margin: 35px 0 20px; padding-bottom: 12px; border-bottom: 2px solid #f1f5f9; 
    color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: 1.5px; 
    text-transform: uppercase; display: flex; align-items: center; gap: 10px; 
}
.section-title svg { width: 18px; height: 18px; color: var(--accent); stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;}
.section-title:first-child { margin-top: 0; }

.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

input, textarea, select {
    width: 100%; padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 10px;
    background: #f8fafc; color: var(--text-main); font-size: 14px; transition: all 0.2s ease;
    font-family: inherit;
}
textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15); outline: none; }
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%2364748b%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 16px auto; }

/* Buttons */
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
.button {
    width: 100%; padding: 14px 20px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase;
}
.button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.button:active { transform: scale(0.98); }
.button.primary { background: var(--primary); color: #fff; }
.button.primary:hover { background: var(--primary-hover); box-shadow: 0 6px 15px rgba(15,23,42,0.2); }
.button.gold { background: var(--accent); color: #fff; }
.button.gold:hover { background: var(--accent-hover); box-shadow: 0 6px 15px rgba(212,175,55,0.3); }
.button.secondary { background: #e2e8f0; color: var(--text-main); }
.button.secondary:hover { background: #cbd5e1; }
.button.danger { background: #fee2e2; color: var(--danger); }
.button.danger:hover { background: #fecaca; color: var(--danger-hover); }

.sig-row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 15px; }
.sig-row-half { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Toast Notification */
#toast {
    position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
    background: #10b981; color: white; padding: 14px 30px; border-radius: 50px;
    font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(16,185,129,0.4);
    transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000;
    display: flex; align-items: center; gap: 10px;
}
#toast svg { width: 18px; height: 18px; }
#toast.show { bottom: 40px; }

@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 1024px) {
    .workspace { grid-template-columns: 1fr; }
    .preview-panel { position: relative; top: 0; }
    .preview-content { height: 700px; }
}
@media (max-width: 600px) {
    .app { padding: 20px 15px; }
    .sig-row, .sig-row-half, .btn-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>S&P Report Creator Pro</h1>
        <p>Generate beautiful, universally compatible emails instantly.</p>
    </div>

    <div class="workspace">
        <!-- SETTINGS PANEL -->
        <div class="panel settings-panel">
            
            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5z"></path><path d="M14 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V5z"></path><path d="M4 15a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4z"></path><path d="M14 15a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4z"></path></svg>
                Template Layout
            </div>
            <div class="form-group">
                <select id="templateLayout" onchange="updatePreview()">
                    <option value="1">Template 1: Classic Professional (Blue & Gold)</option>
                    <option value="2">Template 2: Cinematic Dark (Black & Gold)</option>
                    <option value="3">Template 3: Modern Minimalist (White & Gray)</option>
                    <option value="4">Template 4: Vibrant Pill-Based (Blue Theme)</option>
                    <option value="5">Template 5: Corporate Emerald (Green Accents)</option>
                    <option value="6">Template 6: Studio Slate (Charcoal & Crimson)</option>
                    <option value="7">Template 7: Elegant Luxury (Cream & Serif)</option>
                    <option value="8">Template 8: Brutalist High Contrast (B&W)</option>
                    <option value="9">Template 9: Tech Neon (Dark Blue & Cyan)</option>
                    <option value="10">Template 10: Soft Pastel (Gentle & Rounded)</option>
                </select>
            </div>

            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Project Information
            </div>
            <div class="sig-row-half">
                <div class="form-group">
                    <label>Company / Brand</label>
                    <input type="text" id="company" value="LIONSGATE">
                </div>
                <div class="form-group">
                    <label>Report Type</label>
                    <input type="text" id="reportType" value="S&P Report">
                </div>
            </div>
            <div class="form-group">
                <label>Project Full Title & ID</label>
                <input type="text" id="projectFull" value="Conan el bárbaro - 9382098CSP">
            </div>
            <div class="form-group">
                <label>Project File / Google Drive Link</label>
                <input type="url" id="driveLink" placeholder="Paste Drive link (auto-converts)">
            </div>
            <div class="form-group">
                <label>Review Sheet Link</label>
                <input type="url" id="sheetLink" placeholder="Paste Google Sheet link">
            </div>

            <div class="section-title">
                <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                Action Required
            </div>
            <div class="form-group">
                <label>Action Heading</label>
                <input type="text" id="actionTitle" value="Actions">
            </div>
            <div class="form-group">
                <label>Action Description</label>
                <textarea id="actionText">Kindly review the report and update the review sheet with your comments.</textarea>
            </div>

            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Signature Details
            </div>
            <div class="form-group">
                <label>Load Saved Signature</label>
                <select id="savedSignaturesDropdown" onchange="loadSelectedSignature()">
                    <option value="">-- Select or Create New --</option>
                </select>
            </div>
            <div class="sig-row-half">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="signatureName" value="John Doe">
                </div>
                <div class="form-group">
                    <label>Designation</label>
                    <input type="text" id="signatureRole" value="Creative Consultant">
                </div>
            </div>
            <div class="sig-row-half">
                <div class="form-group">
                    <label>Mobile</label>
                    <input type="tel" id="signatureMobile" placeholder="+1 555-0100">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signatureEmail" placeholder="name@company.com">
                </div>
            </div>
            <div class="form-group">
                <label>Website</label>
                <input type="text" id="signatureWebsite" value="www.lionsgate.com">
            </div>

            <div class="sig-row" style="margin-top: 20px; align-items: end;">
                <div class="form-group" style="margin:0;">
                    <label>Save Profile As</label>
                    <input type="text" id="sigProfileName" placeholder="e.g. Main Profile">
                </div>
                <button type="button" class="button primary" onclick="saveSignature()">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Save Sig
                </button>
            </div>

            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Export & Output
            </div>
            <div class="btn-grid">
                <button type="button" class="button gold" onclick="copyForEmail()">
                    <svg viewBox="0 0 24 24"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    Copy for Email
                </button>
                <button type="button" class="button secondary" onclick="copyHTMLSource()">
                    <svg viewBox="0 0 24 24"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    Copy HTML
                </button>
            </div>
            <div class="btn-grid">
                <button type="button" class="button secondary" onclick="downloadHTML()">
                    <svg viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download HTML
                </button>
                <button type="button" class="button danger" onclick="clearAllData()">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"></path></svg>
                    Restart (Wipe Data)
                </button>
            </div>
        </div>

        <!-- PREVIEW PANEL -->
        <div class="preview-panel">
            <div class="preview-container">
                <div class="preview-header">
                    <span>Live HTML Preview</span>
                    <span style="font-size: 11px; font-weight: normal; background: #e2e8f0; padding: 4px 10px; border-radius: 20px; color:#475569;">Perfectly Isolated & Responsive</span>
                </div>
                <!-- IFRAME replaces the old div to completely prevent rendering overlap -->
                <div class="preview-content" id="previewWrapperBg">
                    <iframe id="emailPreviewFrame" title="Email Preview"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    <span id="toastMessage">Action successful!</span>
</div>

<script>
/* =========================================================
   CORE LOGIC & UTILITIES
========================================================= */
// Replaced the broken Base64 string with the direct, reliable AWS S3 link.
const AMAGI_LOGO_URL = "https://s3.amazonaws.com/cdn.freshdesk.com/data/helpdesk/attachments/production/69003522040/logo/LkC0KD0QCT1-BmqFLXvbNAKC7_SoZZQazw.png";

let signatures = {};

function getSafeStorage() { try { return window.localStorage; } catch (e) { return null; } }
function getValue(id, fallback = "") { const el = document.getElementById(id); return el ? el.value.trim() || fallback : fallback; }
function escapeHTML(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
function safeURL(url) { if (!url) return "#"; if (/^https?:\/\//i.test(url) || url.startsWith("mailto:")) return url; return "https://" + url; }

function getProjectDownloadLink(url) {
    if (!url) return "#";
    const original = String(url).trim();
    const fileMatch = original.match(/\/file\/d\/([a-zA-Z0-9_-]+)/i);
    if (fileMatch && fileMatch[1]) {
        return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(fileMatch[1]);
    }
    return safeURL(original);
}

function parseProjectInput(input) {
    let title = input;
    let id = "";
    if (input.includes("-")) {
        const parts = input.split("-");
        id = parts.pop().trim();
        title = parts.join("-").trim();
    }
    return { title, id };
}

function showToast(message, isError = false) {
    const toast = document.getElementById("toast");
    document.getElementById("toastMessage").textContent = message;
    toast.style.background = isError ? "#ef4444" : "#10b981";
    toast.classList.add("show");
    setTimeout(() => { toast.classList.remove("show"); }, 3000);
}

/* =========================================================
   SIGNATURE MANAGEMENT
========================================================= */
function initSignatures() {
    const storage = getSafeStorage();
    if (storage) {
        try {
            const saved = storage.getItem("spTemplateSignaturesV6");
            if (saved) signatures = JSON.parse(saved);
        } catch (e) {}
    }
    populateSignatureDropdown();
}

function populateSignatureDropdown() {
    const dropdown = document.getElementById("savedSignaturesDropdown");
    dropdown.innerHTML = '<option value="">-- Select or Create New --</option>';
    for (const key in signatures) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = key;
        dropdown.appendChild(opt);
    }
}

function loadSelectedSignature() {
    const key = document.getElementById("savedSignaturesDropdown").value;
    if (!key || !signatures[key]) return;
    const sig = signatures[key];
    document.getElementById("signatureName").value = sig.name || "";
    document.getElementById("signatureRole").value = sig.role || "";
    document.getElementById("signatureMobile").value = sig.mobile || "";
    document.getElementById("signatureEmail").value = sig.email || "";
    document.getElementById("signatureWebsite").value = sig.website || "";
    updatePreview();
}

function saveSignature() {
    let profileName = getValue("sigProfileName", "").trim();
    if (!profileName) profileName = "Signature " + (Object.keys(signatures).length + 1);
    
    signatures[profileName] = {
        name: getValue("signatureName"),
        role: getValue("signatureRole"),
        mobile: getValue("signatureMobile"),
        email: getValue("signatureEmail"),
        website: getValue("signatureWebsite")
    };

    const storage = getSafeStorage();
    if (storage) {
        try {
            storage.setItem("spTemplateSignaturesV6", JSON.stringify(signatures));
            showToast(`Signature "${profileName}" saved!`);
            populateSignatureDropdown();
            document.getElementById("savedSignaturesDropdown").value = profileName;
        } catch (e) { showToast("Error saving signature.", true); }
    }
}

/* =========================================================
   RESTART / WIPE ALL DATA
========================================================= */
function clearAllData() {
    if(!confirm("Are you sure you want to completely wipe all inputs? (Signatures will remain saved)")) return;
    
    document.getElementById("company").value = "";
    document.getElementById("reportType").value = "";
    document.getElementById("projectFull").value = "";
    document.getElementById("driveLink").value = "";
    document.getElementById("sheetLink").value = "";
    document.getElementById("actionTitle").value = "Actions";
    document.getElementById("actionText").value = "";
    
    document.getElementById("savedSignaturesDropdown").value = "";
    document.getElementById("signatureName").value = "";
    document.getElementById("signatureRole").value = "";
    document.getElementById("signatureMobile").value = "";
    document.getElementById("signatureEmail").value = "";
    document.getElementById("signatureWebsite").value = "";
    document.getElementById("sigProfileName").value = "";

    updatePreview();
    showToast("All fields wiped clean!");
}

/* =========================================================
   HTML EMAIL GENERATOR
========================================================= */
function getEmailHTML() {
    const layoutType = document.getElementById("templateLayout").value;
    
    // Data extraction
    const data = {
        company: escapeHTML(getValue("company", "Company")),
        reportType: escapeHTML(getValue("reportType", "Report")),
        fullText: escapeHTML(getValue("projectFull", "Project Name")),
        driveLink: escapeHTML(getProjectDownloadLink(getValue("driveLink", "#"))),
        sheetLink: escapeHTML(safeURL(getValue("sheetLink", "#"))),
        actionTitle: escapeHTML(getValue("actionTitle", "Actions")),
        actionText: escapeHTML(getValue("actionText", "Please review.")),
        name: escapeHTML(getValue("signatureName", "Name")),
        role: escapeHTML(getValue("signatureRole", "Role")),
        mobile: escapeHTML(getValue("signatureMobile", "")),
        email: escapeHTML(getValue("signatureEmail", "")),
        websiteLabel: escapeHTML(getValue("signatureWebsite", "www.website.com")),
        websiteUrl: escapeHTML(safeURL(getValue("signatureWebsite", "www.website.com")))
    };
    
    const parsed = parseProjectInput(getValue("projectFull", "Project Name"));
    data.movie = escapeHTML(parsed.title);
    data.reportId = escapeHTML(parsed.id);

    // Dynamic Introductory Sentence (Required in all templates)
    const introSentence = `Please find the <strong>${data.fullText} ${data.reportType}</strong> for the title below.`;

    // Signature Builder - Fixed Logo URL and robust table styling
    const getSig = (tc, mc, lc, topBorder = true) => `
        <div style="margin-top:35px; padding-top:25px; ${topBorder ? `border-top:1px solid ${mc}40;` : ''}">
            <div style="margin-bottom:2px; color:${tc}; font-size:15px; line-height:22px; font-weight:700;">${data.name}</div>
            <div style="margin-bottom:12px; color:${mc}; font-size:13px; line-height:20px;">${data.role}</div>
            <img src="${AMAGI_LOGO_URL}" alt="Logo" width="85" style="display:block; width:85px; max-width:85px; height:auto; margin-bottom:12px; border:none; outline:none; background:transparent;">
            <div style="color:${mc}; font-size:12px; line-height:20px;">
                ${data.mobile ? `<div><strong style="color:${tc};">&#128241;</strong> ${data.mobile}</div>` : ''}
                ${data.email ? `<div><strong style="color:${tc};">&#9993;</strong> <a href="mailto:${data.email}" style="color:${lc}; text-decoration:none;">${data.email}</a></div>` : ''}
                ${data.websiteLabel ? `<div><strong style="color:${tc};">&#127760;</strong> <a href="${data.websiteUrl}" target="_blank" style="color:${lc}; text-decoration:none;">${data.websiteLabel}</a></div>` : ''}
            </div>
        </div>
    `;

    let html = '';
    let previewBg = '';

    switch(layoutType) {
        case "1": // Classic Professional
            previewBg = "#eef1f5";
            html = `<table width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f5; padding:40px 15px; font-family:Arial, sans-serif;"><tr><td align="center">
            <table width="100%" cellpadding="0" cellspacing="0" style="max-width:660px; background:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e2e8f0; margin:0 auto;">
            <tr><td style="background:#172033; padding:35px 40px;">
                <div style="color:#94a3b8; font-size:11px; letter-spacing:2px; text-transform:uppercase;">${data.company}</div>
                <div style="margin-top:6px; color:#ffffff; font-size:24px; font-weight:bold;">${data.fullText}<br><span style="color:#D4AF37;">${data.reportType}</span></div>
            </td></tr>
            <tr><td style="height:4px; background:#D4AF37; line-height:0;">&nbsp;</td></tr>
            <tr><td style="padding:40px;">
                <div style="color:#0f172a; font-size:20px; font-weight:bold; margin-bottom:20px;">Report Ready for Review</div>
                <div style="color:#475569; font-size:15px; margin-bottom:30px;">${introSentence}</div>
                
                <a href="${data.driveLink}" target="_blank" style="display:block; padding:20px; border:1px solid #cbd5e1; border-radius:8px; background:#f8fafc; text-decoration:none;">

// Writes perfectly safely to the iframe sandbox
function updatePreview() {
    const html = getEmailHTML();
    const iframe = document.getElementById("emailPreviewFrame");
    iframe.srcdoc = html;
}

async function copyForEmail() {
    updatePreview();
    const html = getEmailHTML();
    const text = getPlainText();

    try {
        if (navigator.clipboard && window.ClipboardItem) {
            const item = new ClipboardItem({
                "text/html": new Blob([html], { type: "text/html" }),
                "text/plain": new Blob([text], { type: "text/plain" })
            });
            await navigator.clipboard.write([item]);
            showToast("Copied! Paste directly into Gmail or Outlook.");
            return;
        }
    } catch (e) {}

    const wrapper = document.createElement("div");
    wrapper.innerHTML = html;
    wrapper.style.position = "fixed"; wrapper.style.left = "-999999px";
    document.body.appendChild(wrapper);
    const range = document.createRange();
    range.selectNodeContents(wrapper);
    const selection = window.getSelection();
    selection.removeAllRanges(); selection.addRange(range);
    document.execCommand("copy");
    selection.removeAllRanges(); document.body.removeChild(wrapper);
    showToast("Copied! Paste directly into Gmail or Outlook.");
}

async function copyHTMLSource() {
    const html = getEmailHTML();
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(html);
            showToast("HTML source code copied.");
            return;
        }
    } catch (e) {}
    const textarea = document.createElement("textarea");
    textarea.value = html;
    document.body.appendChild(textarea);
    textarea.select(); document.execCommand("copy");
    document.body.removeChild(textarea);
    showToast("HTML source code copied.");
}

function downloadHTML() {
    const html = getEmailHTML();
    const filename = getValue("projectFull", "Project").replace(/[^a-z0-9]/gi, "_").replace(/_+/g, "_") + "_Report.html";
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("HTML file downloaded.");
}
